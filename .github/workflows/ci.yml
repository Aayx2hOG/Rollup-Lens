name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zk_rollup
  DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zk_rollup
  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zk_rollup

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zk_rollup
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zk_rollup"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --exclude validity-prover --exclude validity-guest --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace --exclude validity-prover --exclude validity-guest

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Check formatting
        run: forge fmt --check

      - name: Run tests
        run: forge test

  frontend:
    name: Explorer UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/explorer-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Build
        run: bun run build

  prisma:
    name: Prisma
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate schema
        run: bunx prisma validate --schema prisma/schema.prisma

      - name: Render migration SQL from schema
        run: bunx prisma migrate diff --from-empty --to-schema prisma/schema.prisma --script
