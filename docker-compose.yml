services:
  postgres:
    image: postgres:16
    container_name: zk-rollup-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zk_rollup
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zk_rollup"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
