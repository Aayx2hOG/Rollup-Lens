<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320" role="img" aria-labelledby="title desc">
  <title id="title">RollupLens system design</title>
  <desc id="desc">Deployment topology and runtime data flows across the browser, web edge, Explorer API, PostgreSQL, operator, SP1 prover, settlement client, EVM RPC, L1 deposit inbox, validity settlement contract, and SP1 verifier.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#15803d"/>
    </marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#c2410c"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .zone { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .user-zone { fill: #eff6ff; stroke: #93c5fd; stroke-width: 2; rx: 18; }
      .external-zone { fill: #faf5ff; stroke: #c4b5fd; stroke-width: 2; rx: 18; }
      .title { font: 700 31px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 15px Arial, sans-serif; fill: #475569; }
      .zone-title { font: 700 14px Arial, sans-serif; fill: #475569; letter-spacing: 1px; }
      .zone-note { font: 12px Arial, sans-serif; fill: #64748b; }
      .box { stroke-width: 2; rx: 12; }
      .client { fill: #dbeafe; stroke: #2563eb; }
      .service { fill: #f8fafc; stroke: #334155; }
      .store { fill: #f0fdf4; stroke: #16a34a; }
      .worker { fill: #fff7ed; stroke: #ea580c; }
      .proof { fill: #faf5ff; stroke: #9333ea; }
      .chain { fill: #f5f3ff; stroke: #6d28d9; }
      .note-box { fill: #ecfeff; stroke: #0891b2; stroke-width: 1.5; rx: 10; }
      .text { font: 700 17px Arial, sans-serif; fill: #0f172a; }
      .small { font: 13px Arial, sans-serif; fill: #475569; }
      .tiny { font: 12px Arial, sans-serif; fill: #64748b; }
      .line { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .http { stroke: #2563eb; stroke-width: 2.3; fill: none; marker-end: url(#arrow-blue); }
      .db { stroke: #15803d; stroke-width: 2.3; fill: none; marker-end: url(#arrow-green); }
      .proof-line { stroke: #7c3aed; stroke-width: 2.4; fill: none; marker-end: url(#arrow-purple); }
      .l1-line { stroke: #c2410c; stroke-width: 2.4; fill: none; marker-end: url(#arrow-orange); }
      .recovery { stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 6; fill: none; marker-end: url(#arrow); }
      .boundary { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 7 6; fill: none; rx: 12; }
      .label { font: 12px Arial, sans-serif; fill: #334155; }
      .http-label { font: 12px Arial, sans-serif; fill: #1d4ed8; font-weight: 700; }
      .db-label { font: 12px Arial, sans-serif; fill: #15803d; font-weight: 700; }
      .proof-label { font: 12px Arial, sans-serif; fill: #7c3aed; font-weight: 700; }
      .l1-label { font: 12px Arial, sans-serif; fill: #c2410c; font-weight: 700; }
    </style>
  </defs>

  <rect width="1800" height="1320" class="bg"/>
  <text x="50" y="48" class="title">RollupLens - Current System Design</text>
  <text x="50" y="76" class="subtitle">Postgres-backed rollup explorer with L1 deposits, L2 sequencing, withdrawal commitments, SP1 proving, settlement submission, and safe/finalized L1 reconciliation.</text>

  <rect x="40" y="110" width="330" height="300" class="zone"/>
  <text x="62" y="140" class="zone-title">SERVER 1 - WEB EDGE / CDN</text>
  <text x="62" y="160" class="zone-note">Stateless static hosting</text>
  <rect x="75" y="198" width="260" height="112" class="box service"/>
  <text x="132" y="235" class="text">Explorer UI Assets</text>
  <text x="106" y="263" class="small">React/Vite HTML, JS, CSS</text>
  <text x="116" y="286" class="small">no wallet keys or state</text>

  <rect x="40" y="450" width="330" height="390" class="user-zone"/>
  <text x="62" y="480" class="zone-title">USER DEVICE</text>
  <text x="62" y="500" class="zone-note">Trust boundary: private key stays local</text>
  <rect x="75" y="535" width="260" height="135" class="box client"/>
  <text x="128" y="572" class="text">Browser Explorer</text>
  <text x="103" y="600" class="small">signs EIP-712 L2 transfers</text>
  <text x="111" y="623" class="small">submits withdrawals</text>
  <text x="111" y="646" class="small">reads batches and proofs</text>
  <rect x="75" y="705" width="260" height="90" class="box client"/>
  <text x="133" y="742" class="text">Wallet / CLI</text>
  <text x="100" y="770" class="small">optional local signing utility</text>

  <rect x="410" y="110" width="395" height="730" class="zone"/>
  <text x="432" y="140" class="zone-title">SERVER 2 - EXPLORER API</text>
  <text x="432" y="160" class="zone-note">Axum service; stateless outside Postgres</text>
  <rect x="455" y="195" width="305" height="108" class="box service"/>
  <text x="546" y="232" class="text">HTTP API</text>
  <text x="487" y="260" class="small">health, search, explorer reads</text>
  <text x="490" y="283" class="small">batch, deposit, withdrawal endpoints</text>
  <rect x="455" y="345" width="305" height="128" class="box worker"/>
  <text x="520" y="382" class="text">Transaction Intake</text>
  <text x="481" y="410" class="small">verifies signer, nonce, balance</text>
  <text x="488" y="433" class="small">persists transaction_pool row</text>
  <text x="500" y="456" class="small">NOTIFY after commit</text>
  <rect x="455" y="510" width="305" height="105" class="box worker"/>
  <text x="526" y="547" class="text">Withdrawal Intake</text>
  <text x="489" y="575" class="small">validates signed withdrawal request</text>
  <text x="509" y="598" class="small">persists withdrawal_pool row</text>
  <rect x="455" y="650" width="305" height="125" class="box worker"/>
  <text x="565" y="687" class="text">Sequencer</text>
  <text x="489" y="715" class="small">locks pending rows with SKIP LOCKED</text>
  <text x="477" y="738" class="small">executes transfers, deposits, withdrawals</text>
  <text x="481" y="761" class="small">persists batch commitment + witness</text>
  <rect x="455" y="795" width="305" height="32" class="box service"/>
  <text x="492" y="816" class="small">wallet-core, chain-core, merkle-core, validity-core</text>

  <rect x="845" y="110" width="365" height="730" class="zone"/>
  <text x="867" y="140" class="zone-title">SERVER 3 - POSTGRESQL</text>
  <text x="867" y="160" class="zone-note">Durable source of truth and coordination</text>
  <rect x="890" y="195" width="275" height="138" class="box store"/>
  <text x="968" y="232" class="text">L2 State</text>
  <text x="914" y="260" class="small">accounts, blocks, transactions</text>
  <text x="914" y="283" class="small">transaction_pool, withdrawal_pool</text>
  <text x="928" y="306" class="small">history, alerts, errors</text>
  <rect x="890" y="370" width="275" height="148" class="box store"/>
  <text x="949" y="407" class="text">Rollup Batches</text>
  <text x="915" y="435" class="small">state roots and data hash</text>
  <text x="903" y="458" class="small">deposit and withdrawal roots</text>
  <text x="909" y="481" class="small">validity witness and calldata</text>
  <text x="918" y="504" class="small">operator claim lifecycle</text>
  <rect x="890" y="555" width="275" height="122" class="box store"/>
  <text x="941" y="592" class="text">L1 Index Data</text>
  <text x="906" y="620" class="small">canonical deposits and checkpoints</text>
  <text x="908" y="643" class="small">safe/finalized batch events</text>
  <text x="923" y="666" class="small">receipts and reorg state</text>
  <rect x="890" y="715" width="275" height="70" class="note-box"/>
  <text x="915" y="744" class="small">NOTIFY/LISTEN wake-up only</text>
  <text x="914" y="767" class="small">rows remain the durable queue</text>

  <rect x="1250" y="110" width="505" height="730" class="zone"/>
  <text x="1272" y="140" class="zone-title">SERVER 4 - OPERATOR HOST</text>
  <text x="1272" y="160" class="zone-note">Daemon plus local child processes; artifacts on attached disk</text>
  <rect x="1290" y="195" width="425" height="178" class="box worker"/>
  <text x="1431" y="232" class="text">Operator Daemon</text>
  <text x="1318" y="260" class="small">LISTEN wake-up plus OPERATOR_POLL_SECONDS recovery</text>
  <text x="1326" y="283" class="small">indexes deposits and batch finalization logs</text>
  <text x="1330" y="306" class="small">claims the L1 contract's next batch number</text>
  <text x="1322" y="329" class="small">coordinates sequencing, proving, broadcast, retries</text>
  <text x="1338" y="352" class="small">supports --index-deposits-only hosted mode</text>
  <rect x="1280" y="410" width="445" height="270" class="boundary"/>
  <text x="1300" y="435" class="zone-note">CHILD PROCESSES ON THE OPERATOR HOST</text>
  <rect x="1310" y="465" width="180" height="128" class="box proof"/>
  <text x="1350" y="502" class="text">SP1 Prover</text>
  <text x="1334" y="530" class="small">loads witness</text>
  <text x="1323" y="553" class="small">re-executes guest</text>
  <text x="1325" y="576" class="small">writes Groth16 proof</text>
  <rect x="1520" y="465" width="180" height="128" class="box proof"/>
  <text x="1537" y="502" class="text">Settlement Client</text>
  <text x="1540" y="530" class="small">builds submitBatch</text>
  <text x="1542" y="553" class="small">broadcasts via RPC</text>
  <text x="1546" y="576" class="small">does not finalize DB</text>
  <rect x="1310" y="625" width="390" height="34" class="box service"/>
  <text x="1366" y="647" class="small">operator-artifacts/ proof and public-value files</text>

  <rect x="410" y="890" width="1345" height="345" class="external-zone"/>
  <text x="432" y="920" class="zone-title">EXTERNAL BOUNDARY - EVM RPC AND L1 NETWORK</text>
  <text x="432" y="940" class="zone-note">RPC availability, chain reorgs, and finality tags are external dependencies</text>
  <rect x="455" y="990" width="240" height="110" class="box chain"/>
  <text x="538" y="1027" class="text">EVM RPC</text>
  <text x="486" y="1055" class="small">eth_call, sendRawTx, receipts</text>
  <text x="495" y="1078" class="small">safe/finalized log scans</text>
  <rect x="765" y="980" width="250" height="128" class="box chain"/>
  <text x="813" y="1017" class="text">L1DepositInbox</text>
  <text x="789" y="1045" class="small">accepts ETH deposits</text>
  <text x="782" y="1068" class="small">emits DepositAccepted</text>
  <text x="800" y="1091" class="small">ordered deposit IDs</text>
  <rect x="1085" y="965" width="340" height="158" class="box chain"/>
  <text x="1132" y="1002" class="text">ValidityRollupSettlement</text>
  <text x="1119" y="1030" class="small">enforces sequential batches</text>
  <text x="1115" y="1053" class="small">binds state, tx, deposit, withdrawal roots</text>
  <text x="1129" y="1076" class="small">checks L1 deposit inbox address</text>
  <text x="1140" y="1099" class="small">emits BatchFinalized</text>
  <rect x="1495" y="990" width="220" height="110" class="box chain"/>
  <text x="1548" y="1027" class="text">SP1 Verifier</text>
  <text x="1525" y="1055" class="small">checks vkey, public values</text>
  <text x="1539" y="1078" class="small">and Groth16 proof</text>
  <rect x="455" y="1160" width="1260" height="45" class="note-box"/>
  <text x="681" y="1188" class="small">Finality rule: Postgres finalizes only after a successful receipt and matching finalized BatchFinalized event.</text>

  <path d="M205 310 L205 535" class="http"/>
  <text x="218" y="423" class="http-label">HTTPS assets</text>
  <path d="M335 605 L405 605 L405 250 L455 250" class="http"/>
  <text x="346" y="588" class="http-label">signed L2 transfer + reads</text>
  <path d="M335 650 L395 650 L395 562 L455 562" class="http"/>
  <text x="349" y="674" class="http-label">withdrawal request</text>
  <path d="M335 738 L377 738 L377 1038 L765 1038" class="l1-line"/>
  <text x="388" y="1023" class="l1-label">deposit(l2Recipient)</text>

  <path d="M760 410 L835 410 L835 260 L890 260" class="db"/>
  <text x="770" y="392" class="db-label">pool insert</text>
  <path d="M760 562 L835 562 L835 285 L890 285" class="db"/>
  <text x="772" y="545" class="db-label">withdrawal insert</text>
  <path d="M760 718 L845 718 L845 444 L890 444" class="db"/>
  <text x="775" y="701" class="db-label">atomic block + batch + witness</text>

  <path d="M1165 745 L1232 745 L1232 280 L1290 280" class="db"/>
  <text x="1174" y="726" class="db-label">LISTEN wake-up</text>
  <path d="M1290 318 L1215 318 L1215 480 L1165 480" class="db"/>
  <text x="1176" y="461" class="db-label">claims + lifecycle</text>
  <path d="M1290 250 L815 250 L815 702 L760 702" class="http"/>
  <text x="838" y="235" class="http-label">POST sequence / GET witness / GET calldata</text>
  <path d="M1450 373 L1400 465" class="proof-line"/>
  <text x="1417" y="424" class="proof-label">prove</text>
  <path d="M1490 529 L1520 529" class="proof-line"/>
  <text x="1494" y="515" class="proof-label">artifact</text>

  <path d="M1610 593 L1610 870 L575 870 L575 990" class="proof-line"/>
  <text x="993" y="859" class="proof-label">submit proof, read nextBatchNumber, scan receipts/logs</text>
  <path d="M695 1045 L765 1045" class="l1-line"/>
  <text x="711" y="1032" class="l1-label">logs</text>
  <path d="M1015 1045 L1085 1045" class="proof-line"/>
  <text x="1028" y="1032" class="proof-label">submitBatch</text>
  <path d="M1425 1045 L1495 1045" class="proof-line"/>
  <text x="1440" y="1032" class="proof-label">verifyProof</text>
  <path d="M1495 1084 L1425 1084" class="proof-line"/>
  <text x="1444" y="1106" class="proof-label">result</text>
  <path d="M1085 1095 L695 1095" class="line"/>
  <text x="840" y="1120" class="label">receipt + BatchFinalized event</text>
  <path d="M765 1077 L690 1077 L690 610 L890 610" class="db"/>
  <text x="707" y="596" class="db-label">canonical deposits</text>
  <path d="M575 1100 L575 1260 L1028 1260 L1028 677" class="db"/>
  <text x="714" y="1245" class="db-label">safe/finalized events, receipts, checkpoints</text>

  <path d="M1360 195 L1360 175 L1028 175 L1028 715" class="recovery"/>
  <text x="1065" y="190" class="label">periodic polling recovery when NOTIFY is missed</text>

  <rect x="40" y="1260" width="1715" height="45" class="zone"/>
  <line x1="75" y1="1283" x2="125" y2="1283" class="http"/>
  <text x="138" y="1288" class="small">HTTP</text>
  <line x1="230" y1="1283" x2="280" y2="1283" class="db"/>
  <text x="293" y="1288" class="small">PostgreSQL / LISTEN</text>
  <line x1="465" y1="1283" x2="515" y2="1283" class="proof-line"/>
  <text x="528" y="1288" class="small">proof / settlement</text>
  <line x1="705" y1="1283" x2="755" y2="1283" class="l1-line"/>
  <text x="768" y="1288" class="small">L1 deposit path</text>
  <line x1="930" y1="1283" x2="980" y2="1283" class="recovery"/>
  <text x="993" y="1288" class="small">recovery polling</text>
  <text x="1175" y="1288" class="small">4 owned server boundaries, 1 user device, 1 external EVM/L1 boundary</text>
</svg>
