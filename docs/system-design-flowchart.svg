<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280" role="img" aria-labelledby="title desc">
  <title id="title">ZK Rollup production system design</title>
  <desc id="desc">Deployment topology and data flow across the browser, web server, Explorer API, PostgreSQL, operator, prover, settlement client, EVM RPC, and L1 validity contracts.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#15803d"/>
    </marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#7c3aed"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .zone { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .external-zone { fill: #faf5ff; stroke: #c4b5fd; stroke-width: 2; rx: 18; }
      .title { font: 700 31px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 15px Arial, sans-serif; fill: #475569; }
      .zone-title { font: 700 14px Arial, sans-serif; fill: #475569; letter-spacing: 1px; }
      .zone-note { font: 12px Arial, sans-serif; fill: #64748b; }
      .box { stroke-width: 2; rx: 12; }
      .client { fill: #eff6ff; stroke: #2563eb; }
      .service { fill: #f8fafc; stroke: #334155; }
      .store { fill: #f0fdf4; stroke: #16a34a; }
      .worker { fill: #fff7ed; stroke: #ea580c; }
      .proof { fill: #faf5ff; stroke: #9333ea; }
      .chain { fill: #f5f3ff; stroke: #6d28d9; }
      .note-box { fill: #ecfeff; stroke: #0891b2; stroke-width: 1.5; rx: 10; }
      .text { font: 700 17px Arial, sans-serif; fill: #0f172a; }
      .small { font: 13px Arial, sans-serif; fill: #475569; }
      .tiny { font: 12px Arial, sans-serif; fill: #64748b; }
      .line { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .http { stroke: #2563eb; stroke-width: 2.3; fill: none; marker-end: url(#arrow-blue); }
      .db { stroke: #15803d; stroke-width: 2.3; fill: none; marker-end: url(#arrow-green); }
      .proof-line { stroke: #7c3aed; stroke-width: 2.4; fill: none; marker-end: url(#arrow-purple); }
      .recovery { stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 6; fill: none; marker-end: url(#arrow); }
      .boundary { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 7 6; fill: none; rx: 12; }
      .label { font: 12px Arial, sans-serif; fill: #334155; }
      .http-label { font: 12px Arial, sans-serif; fill: #1d4ed8; font-weight: 700; }
      .db-label { font: 12px Arial, sans-serif; fill: #15803d; font-weight: 700; }
      .proof-label { font: 12px Arial, sans-serif; fill: #7c3aed; font-weight: 700; }
    </style>
  </defs>

  <rect width="1800" height="1280" class="bg"/>
  <text x="50" y="48" class="title">ZK Rollup — Deployment Topology &amp; Runtime Flow</text>
  <text x="50" y="76" class="subtitle">Four owned application/data server boundaries plus an external EVM RPC/L1 boundary. Boxes inside one server share a host but remain separate processes.</text>

  <!-- Server 1: web edge -->
  <rect x="40" y="110" width="330" height="300" class="zone"/>
  <text x="62" y="140" class="zone-title">SERVER 1 · WEB EDGE / CDN</text>
  <text x="62" y="160" class="zone-note">Stateless; serves compiled explorer assets</text>
  <rect x="75" y="195" width="260" height="105" class="box service"/>
  <text x="132" y="232" class="text">Explorer UI Assets</text>
  <text x="108" y="260" class="small">React/Vite static HTML, JS, CSS</text>
  <text x="115" y="283" class="small">no wallet keys stored here</text>

  <!-- User device -->
  <rect x="40" y="450" width="330" height="355" class="zone"/>
  <text x="62" y="480" class="zone-title">USER DEVICE · NOT A SERVER</text>
  <text x="62" y="500" class="zone-note">Trust boundary: private key never leaves browser</text>
  <rect x="75" y="535" width="260" height="125" class="box client"/>
  <text x="129" y="572" class="text">Browser Explorer</text>
  <text x="105" y="600" class="small">generates/imports wallet locally</text>
  <text x="108" y="623" class="small">signs transfers locally</text>
  <text x="106" y="646" class="small">reads explorer and batch status</text>
  <rect x="75" y="700" width="260" height="70" class="box client"/>
  <text x="149" y="731" class="text">Wallet CLI</text>
  <text x="108" y="755" class="small">optional local signing utility</text>

  <!-- Server 2: API -->
  <rect x="410" y="110" width="390" height="695" class="zone"/>
  <text x="432" y="140" class="zone-title">SERVER 2 · EXPLORER API</text>
  <text x="432" y="160" class="zone-note">One Axum service; horizontally scalable for reads</text>
  <rect x="455" y="195" width="300" height="110" class="box service"/>
  <text x="544" y="232" class="text">HTTP API</text>
  <text x="487" y="260" class="small">health, search, explorer reads</text>
  <text x="487" y="283" class="small">transaction and batch endpoints</text>
  <rect x="455" y="355" width="300" height="125" class="box worker"/>
  <text x="525" y="392" class="text">Transaction Intake</text>
  <text x="482" y="420" class="small">verifies signature, nonce, balance</text>
  <text x="477" y="443" class="small">accounts for earlier pending transfers</text>
  <text x="507" y="466" class="small">commits durable pool row</text>
  <rect x="455" y="535" width="300" height="155" class="box worker"/>
  <text x="563" y="572" class="text">Sequencer</text>
  <text x="483" y="600" class="small">locks pool rows with SKIP LOCKED</text>
  <text x="480" y="623" class="small">executes deterministic next block</text>
  <text x="480" y="646" class="small">updates accounts and pool status</text>
  <text x="476" y="669" class="small">persists batch commitment + witness</text>
  <rect x="455" y="730" width="300" height="50" class="box service"/>
  <text x="497" y="761" class="small">chain-core · wallet-core · merkle-core</text>

  <!-- Server 3: database -->
  <rect x="840" y="110" width="350" height="695" class="zone"/>
  <text x="862" y="140" class="zone-title">SERVER 3 · POSTGRESQL</text>
  <text x="862" y="160" class="zone-note">Durable source of truth; direct sessions for LISTEN</text>
  <rect x="885" y="195" width="260" height="155" class="box store"/>
  <text x="956" y="232" class="text">Rollup State</text>
  <text x="918" y="260" class="small">accounts, blocks, transactions</text>
  <text x="912" y="283" class="small">pool, batches, batch members</text>
  <text x="911" y="306" class="small">immutable validity witnesses</text>
  <text x="919" y="329" class="small">errors and API health state</text>
  <rect x="885" y="405" width="260" height="125" class="box store"/>
  <text x="933" y="442" class="text">Operator State</text>
  <text x="913" y="470" class="small">claims, attempts, lifecycle status</text>
  <text x="910" y="493" class="small">L1 receipts and finality metadata</text>
  <text x="930" y="516" class="small">event scan checkpoint</text>
  <rect x="885" y="585" width="260" height="110" class="box store"/>
  <text x="933" y="622" class="text">Postgres Pub-Sub</text>
  <text x="916" y="650" class="small">NOTIFY transaction_pending</text>
  <text x="913" y="673" class="small">wake-up only; payload is not state</text>
  <rect x="885" y="730" width="260" height="50" class="note-box"/>
  <text x="912" y="761" class="small">Pooled SQL + persistent direct listener</text>

  <!-- Server 4: operator -->
  <rect x="1230" y="110" width="520" height="695" class="zone"/>
  <text x="1252" y="140" class="zone-title">SERVER 4 · OPERATOR / PROVING WORKER</text>
  <text x="1252" y="160" class="zone-note">One daemon supervises local child processes; artifacts live on attached disk</text>
  <rect x="1270" y="195" width="440" height="170" class="box worker"/>
  <text x="1420" y="232" class="text">Operator Daemon</text>
  <text x="1302" y="260" class="small">LISTEN wake-up + OPERATOR_POLL_SECONDS recovery tick</text>
  <text x="1312" y="283" class="small">claims exactly the batch expected by the L1 contract</text>
  <text x="1310" y="306" class="small">coordinates sequencing, proving, submission and retries</text>
  <text x="1300" y="329" class="small">indexes confirmed BatchFinalized logs and verifies roots</text>
  <rect x="1260" y="400" width="460" height="300" class="boundary"/>
  <text x="1280" y="425" class="zone-note">CHILD PROCESSES ON THE OPERATOR HOST</text>
  <rect x="1290" y="455" width="190" height="145" class="box proof"/>
  <text x="1335" y="492" class="text">SP1 Prover</text>
  <text x="1315" y="520" class="small">loads persisted witness</text>
  <text x="1310" y="543" class="small">re-executes batch guest</text>
  <text x="1311" y="566" class="small">writes Groth16 artifact</text>
  <text x="1324" y="589" class="small">+ public values</text>
  <rect x="1510" y="455" width="180" height="145" class="box proof"/>
  <text x="1527" y="492" class="text">Settlement Client</text>
  <text x="1535" y="520" class="small">accepts proof artifact</text>
  <text x="1529" y="543" class="small">builds contract call</text>
  <text x="1534" y="566" class="small">broadcasts via RPC</text>
  <text x="1543" y="589" class="small">does not set finality</text>
  <rect x="1290" y="625" width="400" height="50" class="box service"/>
  <text x="1340" y="656" class="small">Attached artifact disk · operator-artifacts/ · retain/protect separately</text>

  <!-- External L1 -->
  <rect x="410" y="850" width="1340" height="330" class="external-zone"/>
  <text x="432" y="880" class="zone-title">EXTERNAL SERVICE BOUNDARY · EVM RPC AND L1 NETWORK</text>
  <text x="432" y="900" class="zone-note">Not an owned rollup application server; availability and confirmation depth are external dependencies</text>
  <rect x="470" y="950" width="270" height="115" class="box chain"/>
  <text x="558" y="987" class="text">EVM RPC</text>
  <text x="500" y="1015" class="small">eth_call, broadcast, receipts</text>
  <text x="501" y="1038" class="small">confirmed log range queries</text>
  <rect x="825" y="935" width="350" height="145" class="box chain"/>
  <text x="871" y="972" class="text">ValidityRollupSettlement</text>
  <text x="863" y="1000" class="small">enforces sequential batch number</text>
  <text x="858" y="1023" class="small">binds roots, commitment and tx count</text>
  <text x="873" y="1046" class="small">emits authoritative BatchFinalized</text>
  <rect x="1260" y="950" width="270" height="115" class="box chain"/>
  <text x="1338" y="987" class="text">SP1 Verifier</text>
  <text x="1293" y="1015" class="small">checks program vkey, public values</text>
  <text x="1307" y="1038" class="small">and Groth16 proof bytes</text>
  <rect x="470" y="1110" width="1060" height="45" class="note-box"/>
  <text x="674" y="1138" class="small">Finality rule: Postgres is updated only after a confirmed successful receipt and a matching BatchFinalized event.</text>

  <!-- Core request/data paths -->
  <path d="M205 300 L205 535" class="http"/>
  <text x="218" y="423" class="http-label">HTTPS assets</text>
  <path d="M335 590 L405 590 L405 250 L455 250" class="http"/>
  <text x="347" y="575" class="http-label">signed HTTP + reads</text>
  <path d="M605 305 L605 355" class="line"/>
  <text x="619" y="335" class="label">submit transfer</text>
  <path d="M755 420 L820 420 L820 265 L885 265" class="db"/>
  <text x="768" y="402" class="db-label">transactional INSERT</text>
  <path d="M755 610 L840 610 L840 320 L885 320" class="db"/>
  <text x="769" y="590" class="db-label">atomic state + witness</text>
  <path d="M1145 640 L1210 640 L1210 280 L1270 280" class="db"/>
  <text x="1156" y="624" class="db-label">LISTEN wake-up</text>
  <path d="M1270 325 L1195 325 L1195 470 L1145 470" class="db"/>
  <text x="1161" y="452" class="db-label">claims + lifecycle</text>
  <path d="M1270 240 L810 240 L810 570 L755 570" class="http"/>
  <text x="842" y="225" class="http-label">POST sequence / GET immutable witness</text>
  <path d="M1420 365 L1420 455" class="proof-line"/>
  <text x="1432" y="414" class="proof-label">spawn + prove</text>
  <path d="M1480 527 L1510 527" class="proof-line"/>
  <text x="1484" y="513" class="proof-label">artifact</text>

  <!-- RPC/L1 paths -->
  <path d="M1600 600 L1600 825 L605 825 L605 950" class="proof-line"/>
  <text x="1070" y="814" class="proof-label">submit proof + read nextBatchNumber + scan receipts/logs</text>
  <path d="M740 1008 L825 1008" class="proof-line"/>
  <text x="758" y="994" class="proof-label">contract call</text>
  <path d="M1175 1008 L1260 1008" class="proof-line"/>
  <text x="1191" y="994" class="proof-label">verifyProof</text>
  <path d="M1260 1050 L1175 1050" class="proof-line"/>
  <text x="1196" y="1070" class="proof-label">result</text>
  <path d="M825 1045 L740 1045" class="line"/>
  <text x="749" y="1065" class="label">receipt + event</text>

  <!-- Recovery path -->
  <path d="M1320 195 L1320 175 L1015 175 L1015 585" class="recovery"/>
  <text x="1050" y="190" class="label">periodic polling recovery if NOTIFY is missed</text>

  <!-- Legend -->
  <rect x="40" y="1210" width="1710" height="45" class="zone"/>
  <line x1="75" y1="1233" x2="125" y2="1233" class="http"/>
  <text x="138" y="1238" class="small">HTTP</text>
  <line x1="230" y1="1233" x2="280" y2="1233" class="db"/>
  <text x="293" y="1238" class="small">PostgreSQL / LISTEN</text>
  <line x1="465" y1="1233" x2="515" y2="1233" class="proof-line"/>
  <text x="528" y="1238" class="small">proof / L1 path</text>
  <line x1="675" y1="1233" x2="725" y2="1233" class="recovery"/>
  <text x="738" y="1238" class="small">recovery polling</text>
  <text x="930" y="1238" class="small">Baseline: 4 owned server boundaries · 1 user device · 1 external EVM/L1 boundary</text>
</svg>
