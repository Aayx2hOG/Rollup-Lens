[workspace]
resolver = "2"
members = [
    "crates/wallet-core",
    "crates/merkle-core",
    "apps/wallet-cli",
    "apps/merkle-cli",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/your-username/zk-rollup"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"

[workspace.dependencies.proptest]
version = "1.6"
