[workspace]
resolver = "2"
members = [
    "crates/wallet-core",
    "crates/merkle-core",
    "crates/chain-core",
    "apps/wallet-cli",
    "apps/merkle-cli",
    "apps/explorer-api",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/your-username/zk-rollup"

[workspace.dependencies]
anyhow = "1.0"
axum = "0.7"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
dotenvy = "0.15"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
http-body-util = "0.1"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["json", "postgres", "runtime-tokio-rustls"] }
tempfile = "3.20"
thiserror = "1.0"
tokio = { version = "1.45", features = ["macros", "net", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors"] }

[workspace.dependencies.proptest]
version = "1.6"
